<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background square with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#0a0a0a"/>
  
  <!-- Zigzag chart line -->
  <polyline points="85,330 160,220 215,280 285,170 340,230 415,120" stroke="#fbbf24" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow head — symmetrisch -->
  <path d="M388,133 L415,120 L417,151" stroke="#fef3c7" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text: MyPeak -->
  <text x="256" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="50" font-weight="500" fill="#fef3c7" letter-spacing="3">MyPeak</text>
  
  <!-- Text: FITNESS -->
  <text x="256" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#fbbf24" letter-spacing="6">FITNESS</text>
