<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FullRep laden – App Store &amp; Google Play</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="FullRep: Training und Ernährung in einer App. Über 220 Übungen, Barcode-Scanner, Makro-Ringe.">
<link rel="canonical" href="https://fullrep.pages.dev/get">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">

<!-- Vorschau beim Teilen (WhatsApp, Facebook, Instagram-DM). Ohne diese Zeilen
     zeigt der Link nur die nackte URL — das kostet Klicks.
     ⚠ Domain ist fullrep.pages.dev (seit 04.10.2026; fullrep.vercel.app ist
     mit dem gesperrten Vercel-Konto tot). Die OG-Adresse muss die echte Domain
     sein: Eine Adresse hinter einer Weiterleitung lesen manche Scraper nicht
     zu Ende, dann bleibt die Vorschau leer. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FullRep">
<meta property="og:title" content="FullRep — Training &amp; Ernährung">
<meta property="og:description" content="Über 220 Übungen, Kalorien und Makros mit Barcode-Scanner, Fortschritt in Zahlen. Alles in einer App.">
<meta property="og:url" content="https://fullrep.pages.dev/get">
<meta property="og:image" content="https://fullrep.pages.dev/icon-512.png">
<meta property="og:locale" content="de_AT">
<meta name="twitter:card" content="summary_large_image">

<style>
  /* Inter selbst gehostet — dieselbe Schrift wie die App und die Social-Posts.
     Kein Google-Request (DSGVO), und kein Nachladen ueber einen Fremd-Host,
     der im In-App-Browser von Instagram auch mal blockiert ist. */
  @font-face {
    font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("/fonts/inter-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter"; font-style: normal; font-weight: 700; font-display: swap;
    src: url("/fonts/inter-700.woff2") format("woff2");
  }

  /* Dieselben Farben wie die App und die Social-Posts: Schwarz mit Amber. */
  :root {
    --grund: #0a0a0a;
    --karte: rgba(255, 255, 255, 0.06);
    --rand: rgba(255, 255, 255, 0.14);
    --amber: #fbbf24;
    --amber-tief: #d97706;
    --creme: #fff8e7;
    --creme-matt: #a8a29e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--grund);
    color: var(--creme);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    align-items: center;
    /* ⚠ KEIN justify-content: center. Ist der Inhalt hoeher als der Schirm,
       schneidet ein zentrierter Flex-Container oben ab — und der abgeschnittene
       Teil laesst sich nicht herunterscrollen. Genau das ist mit dem Screenshot
       passiert: Icon und Name waren weg. `margin: auto` an main zentriert,
       solange Platz ist, und gibt ihn sonst frei. */
    text-align: center;
    padding: max(32px, env(safe-area-inset-top)) 22px max(32px, env(safe-area-inset-bottom));
    position: relative; overflow-x: hidden;
  }

  /* Weiche Lichtflecken statt eines Bildes: nichts nachzuladen, also auch kein
     Blitzen von Weiss, bevor der Hintergrund steht. */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow.g1 { width: 460px; height: 460px; background: var(--amber);      opacity: 0.20; top: -170px; left: -150px; }
  .glow.g2 { width: 420px; height: 420px; background: var(--amber-tief); opacity: 0.22; bottom: -180px; right: -140px; }
  .glow.g3 { width: 340px; height: 340px; background: var(--amber);      opacity: 0.10; top: 40%; right: -170px; }

  main { position: relative; z-index: 1; width: 100%; max-width: 440px; margin: auto 0; }

  /* Icon und Name nebeneinander statt Icon gross obendrueber.
     ⚠ Das FullRep-Icon hat einen SCHWARZEN Grund. Auf der schwarzen Seite
     verschwand es bis auf den Amber-Ring — es sah aus wie ein Ladefehler.
     Der Amber-Rand gibt ihm eine Kante. */
  .kopf { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 0 14px; }
  .icon {
    width: 62px; height: 62px; border-radius: 24%;
    display: block; flex: none;
    box-shadow: 0 10px 26px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(251, 191, 36, 0.35);
  }

  h1 {
    font-weight: 700;
    font-size: clamp(2.1rem, 9vw, 2.6rem);
    line-height: 1; letter-spacing: -0.03em;
    margin: 0;
  }

  /* Der Screenshot traegt die Seite. Ohne ihn ist sie Text auf Schwarz — und
     genau so sah sie aus. */
  /* ⚠ Die Groesse haengt an der HOEHE (vh), nicht an der Breite. Der Screenshot
     ist das laengste Element der Seite; waechst er mit der Breite, schiebt er auf
     kurzen Schirmen den Store-Knopf unter die Falz — und einen Knopf, den man
     erst scrollen muss, tippt niemand. Gemessen in scripts/pruefe-bio-seite.mjs
     gegen die SICHTBARE Hoehe (iPhone: ~660 px, nicht 844). */
  .schirm { position: relative; width: fit-content; margin: 20px auto 24px; }
  .schirm img {
    height: min(40vh, 300px); width: auto; display: block;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 30px 60px -18px rgba(0, 0, 0, 0.9);
  }
  /* Amber-Schein hinter dem Geraet — hebt es vom schwarzen Grund ab. */
  .schirm::before {
    content: ""; position: absolute; z-index: -1;
    left: 50%; top: 10%; transform: translateX(-50%);
    width: 132%; height: 78%;
    background: radial-gradient(closest-side, rgba(251, 191, 36, 0.40), transparent);
    filter: blur(34px);
  }
  /* Der Screenshot ist unten glatt beschnitten (scripts/bio-screenshot.mjs).
     Die Blende laesst ihn auslaufen, statt ihn hart abbrechen zu lassen. */
  .schirm::after {
    content: ""; position: absolute; inset: auto 1px 1px; height: 26%;
    border-radius: 0 0 20px 20px;
    background: linear-gradient(to top, var(--grund) 10%, transparent);
    pointer-events: none;
  }

  /* text-wrap: balance verteilt die Zeilen gleichmaessig, statt das letzte Wort
     allein umzubrechen („Makro-\nRinge"). Browser ohne Unterstuetzung ignorieren
     es und umbrechen wie bisher — kein Rueckfall noetig. */
  .claim { font-size: 1.06rem; font-weight: 700; line-height: 1.35; margin: 0 0 8px; text-wrap: balance; }
  .meta  { font-size: 0.95rem; font-weight: 400; color: var(--creme-matt); margin: 0 0 30px; line-height: 1.5; text-wrap: balance; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 17px 20px; margin-bottom: 13px;
    border-radius: 16px; text-decoration: none;
    font-size: 1.06rem; font-weight: 700;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 21px; height: 21px; flex: none; }

  /* Der Knopf fuer das Geraet, auf dem die Seite gerade offen ist. */
  .btn.primary {
    background: linear-gradient(105deg, var(--amber) 0%, var(--amber-tief) 100%);
    color: #1a1204;
    box-shadow: 0 16px 34px -14px rgba(251, 191, 36, 0.7);
  }
  .btn.primary svg { fill: #1a1204; }

  .btn.ghost {
    background: var(--karte); color: var(--creme);
    border: 1px solid var(--rand);
  }
  .btn.ghost svg { fill: var(--creme); }

  /* Der Web-Link ist bewusst KEIN dritter Knopf: Er ist die Ausweichloesung,
     nicht das Ziel. Als gleich grosse Flaeche neben den zwei Store-Knoepfen zoege
     er Tipps ab, die in den Store gehoeren. */
  .web { display: inline-block; margin-top: 6px; font-size: 0.95rem; font-weight: 700;
         color: var(--amber); text-decoration: none; padding: 10px 14px; }
  .web:active { opacity: 0.7; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 26px 0 0; }
  .chip {
    font-size: 0.86rem; font-weight: 700; color: var(--creme-matt);
    border: 1px solid var(--rand); border-radius: 999px; padding: 7px 14px;
  }

  footer { margin-top: 30px; font-size: 0.86rem; color: var(--creme-matt); }
  footer a { color: var(--creme-matt); text-decoration: underline; }
  footer a:hover { color: var(--creme); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

  <main>
    <div class="kopf">
      <img class="icon" src="/icon-512.png" alt="FullRep App-Icon" width="62" height="62">
      <h1>FullRep</h1>
    </div>

    <p class="claim" id="claim">Training und Ernährung in einer App.</p>
    <p class="meta" id="meta">Über 220 Übungen · Barcode-Scanner · Makro-Ringe</p>

    <!-- width/height gesetzt, damit beim Laden kein Sprung entsteht und die
         Knoepfe nicht unter dem Finger wegrutschen. -->
    <div class="schirm">
      <img src="/bilder/dashboard.webp" alt="" width="560" height="1120" fetchpriority="high">
    </div>

    <div id="knoepfe"></div>

    <a class="web" id="web" href="/">Im Browser öffnen</a>

    <div class="chips" id="chips"></div>

    <footer>
      <a href="/legal/privacy" id="f-datenschutz">Datenschutz</a> ·
      <a href="/legal/imprint" id="f-impressum">Impressum</a>
    </footer>
  </main>

<script>
// Ein Link fuer beide Stores. Er steht in den Profilen von TikTok, Instagram und
// Facebook — deshalb muss er auf JEDEM Geraet irgendwo Sinnvollem landen und darf
// niemanden auf eine Store-Seite schicken, die es nicht gibt.
//
// ⚠ Die beiden Schalter sind die einzige Stelle, die gepflegt werden muss.
// Steht einer auf false, sieht diese Plattform den Knopf gar nicht erst und
// landet in der Web-App. Lieber eine Runde im Browser als eine 404 im Store.
var IOS_LIVE     = true;    // App Store: live (Josefs Bestaetigung, 29.08.2026)
var ANDROID_LIVE = true;    // Google Play: live im Produktions-Track

// ⚠ 6788461300 ist UNSERE ID. Es gibt eine fremde App „MyPeak — Gym Workout
// Tracker" unter 6758337601 im selben Markt — die beiden nicht verwechseln,
// sonst schickt der Bio-Link die eigenen Follower zur Konkurrenz.
var APP_STORE = 'https://apps.apple.com/app/id6788461300';
var PLAY      = 'https://play.google.com/store/apps/details?id=at.gallab.mypeak';

// ⚠ KEINE Weiterleitung mehr (bis 31.08.2026 sprang die Seite auf dem Handy
// sofort in den Store). Zwei Gruende:
// 1. Ein Bio-Link soll zeigen, wohin er fuehrt. „Der Link zeigt nicht den
//    Download" war genau die Rueckmeldung zur Sprungvariante.
// 2. In den In-App-Browsern von Instagram und TikTok geht ein location.replace
//    auf einen Store-Link oefter ins Leere als ein angetippter Link.
// Stattdessen steht der Knopf fuer das eigene Geraet oben und ist hervorgehoben.

var ua = navigator.userAgent || '';
// iPadOS meldet sich seit 13 als Mac — nur der Touch-Punkt verraet es noch.
var istIOS = /iPad|iPhone|iPod/.test(ua) ||
             (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
var istAndroid = /Android/.test(ua);

var texte = {
  de: {
    claim: 'Training und Ernährung in einer App.',
    meta:  'Über 220 Übungen · Barcode-Scanner · Makro-Ringe',
    ios: 'Im App Store laden', android: 'Bei Google Play laden',
    web: 'Im Browser öffnen',
    chips: ['Kraft', 'Cardio', 'HIIT', 'Makros', 'Barcode-Scanner', 'Rest-Timer', 'PRs', 'Wochenplan'],
    datenschutz: 'Datenschutz', impressum: 'Impressum'
  },
  en: {
    claim: 'Workout and nutrition in one app.',
    meta:  '220+ exercises · Barcode scanner · Macro rings',
    ios: 'Download on the App Store', android: 'Get it on Google Play',
    web: 'Open in the browser',
    chips: ['Strength', 'Cardio', 'HIIT', 'Macros', 'Barcode scanner', 'Rest timer', 'PRs', 'Weekly plan'],
    datenschutz: 'Privacy', impressum: 'Imprint'
  }
};
var deutsch = (navigator.language || 'de').slice(0, 2) === 'de';
var t = deutsch ? texte.de : texte.en;
document.documentElement.lang = deutsch ? 'de' : 'en';

document.getElementById('claim').textContent = t.claim;
document.getElementById('meta').textContent = t.meta;
document.getElementById('web').textContent = t.web;
document.getElementById('f-datenschutz').textContent = t.datenschutz;
document.getElementById('f-impressum').textContent = t.impressum;

var SVG_APPLE = '<svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>';
var SVG_PLAY  = '<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>';

// Der Knopf des eigenen Geraets zuerst und hervorgehoben; der andere darunter.
// Auf dem Rechner steht keiner voran — dort ist beides gleich wahrscheinlich.
var knoepfe = [];
if (IOS_LIVE)     knoepfe.push({ href: APP_STORE, text: t.ios,     svg: SVG_APPLE, eigen: istIOS });
if (ANDROID_LIVE) knoepfe.push({ href: PLAY,      text: t.android, svg: SVG_PLAY,  eigen: istAndroid });
knoepfe.sort(function (a, b) { return (b.eigen ? 1 : 0) - (a.eigen ? 1 : 0); });

var behaelter = document.getElementById('knoepfe');
knoepfe.forEach(function (k, i) {
  var a = document.createElement('a');
  // Auf dem Rechner (kein „eigenes" Geraet) bekommt der erste Knopf die Betonung,
  // sonst saehe die Seite dort flach aus.
  var betont = k.eigen || (!istIOS && !istAndroid && i === 0);
  a.className = 'btn ' + (betont ? 'primary' : 'ghost');
  a.href = k.href;
  a.rel = 'noopener';
  a.innerHTML = k.svg + '<span></span>';
  a.querySelector('span').textContent = k.text;
  behaelter.appendChild(a);
});

var chips = document.getElementById('chips');
t.chips.forEach(function (c) {
  var s = document.createElement('span');
  s.className = 'chip';
  s.textContent = c;
  chips.appendChild(s);
});
</script>
</body>
</html>
