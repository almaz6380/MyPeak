# Prüft die api/-Endpunkte bei jedem Pull Request und jedem Push auf main. Die Tests
# brauchen weder Netz noch Secrets — global fetch ist im Prüfstand ersetzt, alle
# Umgebungsvariablen sind Attrappen.
#
# Nicht mehr bei jedem Push auf jeden Zweig: GitHub rechnet jeden Lauf auf volle
# Minuten auf, und ein Push auf einen Zweig mit offenem Pull Request lief doppelt
# (push + pull_request). Das hat das Actions-Kontingent des Kontos mit aufgebraucht,
# das sich alle privaten Projekte teilen.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Bewusst auf api/ + tests/ begrenzt: `npm run lint` über das ganze
      # Projekt meldet aktuell 106 vorbestehende Fehler in src/ und wäre ab
      # dem ersten Lauf rot. Eine Pipeline, die immer rot ist, sagt nichts mehr.
      # Wird der Altbestand aufgeräumt, kann hier `npm run lint` stehen.
      - name: Lint (api + tests)
        run: npx eslint api tests vitest.config.js

      - name: Endpunkt-Tests
        run: npm test
