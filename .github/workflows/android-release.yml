# Android bauen, signieren und zu Google Play hochladen — auf GitHubs Rechnern.
# Damit braucht ein Release keinen Mac mehr und laesst sich aus jeder Claude-Sitzung
# ausloesen (Actions -> "Android Release" -> Run workflow).
#
# Einmalige Einrichtung: siehe docs/release-ci.md (fuenf Android-Secrets).
# WICHTIG: versionCode in android/app/build.gradle vorher erhoehen — Play lehnt
# einen bereits benutzten versionCode ab.
#
# Laeufer „mac" = Josefs eigener Mac als Self-hosted Runner: kostet keine
# GitHub-Minuten, braucht dort aber das Android-SDK (~/Library/Android/sdk).
# Schluessel und Hilfsdateien liegen nur unter $RUNNER_TEMP, nie unter /tmp.
name: Android Release

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: 'An wie viele Nutzer veroeffentlichen? (nur fuer production relevant)'
        type: choice
        default: 'complete'
        options: ['complete', '0.2', '0.5']
      track:
        description: 'Play-Track — internal = interner Test, dort zuerst am Geraet pruefen'
        type: choice
        default: 'production'
        options: ['production', 'internal']
      notes:
        description: 'Was-ist-neu-Text (de-DE)'
        type: string
        default: 'Fehlerkorrekturen und Verbesserungen.'
      upload:
        description: 'Wirklich zu Play hochladen? (aus = nur bauen und als Artefakt ablegen)'
        type: boolean
        default: true
      laeufer:
        description: 'Wo bauen? github = GitHub-Rechner (kostet Minuten), mac = eigener Mac (Self-hosted Runner)'
        type: choice
        default: 'github'
        options: ['github', 'mac']

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # Capacitor 8 / AGP 8.13 brauchen JDK 21

      - name: Android-SDK finden
        # GitHubs Ubuntu-Rechner setzen ANDROID_HOME selbst; auf dem eigenen Mac
        # liegt das SDK dort, wohin Android Studio es installiert.
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] && [ -d "$HOME/Library/Android/sdk" ]; then
            SDK="$HOME/Library/Android/sdk"
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ABBRUCH: Kein Android-SDK gefunden (erwartet unter ~/Library/Android/sdk)."
            exit 1
          fi
          echo "Android-SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Abhaengigkeiten
        run: npm ci

      - name: Keine Test-Werbung im Release
        run: |
          if ! grep -q 'const USE_TEST_ADS = false' src/lib/ads.js; then
            echo "ABBRUCH: USE_TEST_ADS steht nicht auf false — es wuerden Test-Anzeigen ausgeliefert."
            exit 1
          fi
          echo "ok — echte Anzeigen-IDs"

      - name: Kauf angekuendigt, Schluessel vorhanden?
        # Gleiche Logik wie bei iOS: steht PURCHASE_ENABLED.android auf true, muss
        # der goog_-Schluessel gesetzt sein, sonst baut das eine App, die zwar das
        # Abo bewirbt, aber keinen Kauf anbietet. Kein stiller Teilzustand.
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
        run: |
          if grep -q 'android: true' src/pages/PaywallPage.jsx && [ -z "${VITE_REVENUECAT_ANDROID_KEY:-}" ]; then
            echo "::error::PURCHASE_ENABLED.android ist true, aber VITE_REVENUECAT_ANDROID_KEY fehlt."
            echo "Setze das Secret in GitHub -> Settings -> Secrets and variables -> Actions,"
            echo "oder setze android in PaywallPage.jsx wieder auf false."
            exit 1
          fi
          echo "ok — Kauf-Flagge und Schluessel passen zusammen"

      - name: Versionsnummer anzeigen
        run: |
          VC=$(grep -m1 versionCode android/app/build.gradle | tr -dc '0-9')
          VN=$(grep -m1 versionName android/app/build.gradle | cut -d'"' -f2)
          echo "versionCode $VC · versionName $VN"
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      - name: Web-Bundle + Capacitor-Sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          # Nur Laengen und Rueckgabewerte ausgeben, nie Inhalte. GitHub maskiert
          # Secrets im Log ohnehin, aber eine Laenge sagt genug, um zu erkennen ob
          # der Wert ueberhaupt ankommt.
          echo "Secret-Laenge: ${#KEYSTORE_B64} Zeichen"
          SAUBER=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          echo "davon base64-tauglich: ${#SAUBER} Zeichen"

          printf '%s' "$SAUBER" | base64 -d > android/upload-keystore.jks 2>"$RUNNER_TEMP/b64.err"
          RC=$?
          echo "base64 -d: Rueckgabewert $RC, Datei $(wc -c < android/upload-keystore.jks) Bytes"
          if [ "$RC" -ne 0 ] || [ ! -s android/upload-keystore.jks ]; then
            echo "::error::Der Keystore konnte nicht aus ANDROID_KEYSTORE_BASE64 entpackt werden."
            head -3 "$RUNNER_TEMP/b64.err" 2>/dev/null
            exit 1
          fi
          rm -f "$RUNNER_TEMP/b64.err"

          # ACHTUNG: build.gradle liest diese Datei mit Properties.load(). Dort ist der
          # Backslash ein Escape-Zeichen — aus a\b wird ab. Ein Passwort mit \ kaeme also
          # veraendert bei Gradle an, und der Build scheitert beim Signieren mit einer
          # Meldung, die nach einem kaputten Keystore aussieht ("Tag number over 30 is
          # not supported"). Deshalb vor dem Schreiben verdoppeln.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }

          # storeFile laeuft hier ueber rootProject.file(), also relativ zu android/.
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$(esc "$STORE_PASSWORD")
          keyAlias=$(esc "$KEY_ALIAS")
          keyPassword=$(esc "$KEY_PASSWORD")
          EOF

      # Gradle braucht 4-5 Minuten bis zum Signieren. Ein falsches Passwort faellt hier
      # in Sekunden auf — und sagt ausserdem, WELCHER Teil klemmt.
      - name: Signaturschluessel pruefen
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -uo pipefail
          KS=android/upload-keystore.jks
          echo "Keystore: $(wc -c < "$KS") Bytes"

          # Mit dem ROHEN Wert aus der Umgebung, nicht ueber keystore.properties —
          # so trennt der Test das Secret selbst vom Schreiben der Properties-Datei.
          if ! "$JAVA_HOME/bin/keytool" -list -keystore "$KS" \
                 -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/kt.out" 2>&1; then
            echo "::error::Keystore laesst sich mit ANDROID_KEYSTORE_PASSWORD nicht oeffnen."
            echo "Entweder stimmt das Passwort nicht, oder die Datei ist beschaedigt."
            head -5 "$RUNNER_TEMP/kt.out"
            exit 1
          fi
          echo "Store-Passwort ok"

          if ! grep -qiF "$KEY_ALIAS," "$RUNNER_TEMP/kt.out"; then
            echo "::error::Alias aus ANDROID_KEY_ALIAS ist nicht in diesem Keystore."
            echo "Vorhandene Eintraege:"
            grep -i "PrivateKeyEntry\|trustedCertEntry" "$RUNNER_TEMP/kt.out" | cut -d, -f1
            exit 1
          fi
          echo "Alias gefunden"
          rm -f "$RUNNER_TEMP/kt.out"

      - name: AAB bauen
        run: cd android && ./gradlew --no-daemon bundleRelease

      # Die Datei IM Artefakt traegt die Version, nicht nur der Artefaktname.
      #
      # ⚠ Gradle nennt jedes Bundle `app-release.aab` — jedes Projekt, jede
      # Version, seit Jahren. Wer zwei davon in den Downloads liegen hat, laedt
      # bei Play die falsche hoch, und die Meldung lautet dann „Versionscode 1
      # wurde bereits verwendet" statt „falsche Datei". Am 02.09. genau so
      # passiert. Mit `FullRep-1.5.0-vc18.aab` steht die Nummer im Dateinamen
      # und die Verwechslung faellt vor dem Hochladen auf.
      - name: AAB benennen
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "FullRep-${VN}-vc${VC}.aab"
          ls -l "FullRep-${VN}-vc${VC}.aab"

      - name: AAB als Artefakt ablegen
        uses: actions/upload-artifact@v4
        # Nur Bequemlichkeit: Ist GitHubs Artefakt-Speicher voll (so am 25.09.
        # passiert), darf das den Store-Upload danach nicht verhindern.
        continue-on-error: true
        with:
          name: FullRep-${{ env.VN }}-vc${{ env.VC }}
          path: FullRep-${{ env.VN }}-vc${{ env.VC }}.aab
          retention-days: 30

      # Seit R8 aktiv ist (minifyEnabled), sind Stacktraces aus Play Console
      # ohne diese Datei unlesbar (a.b.c statt Klassennamen). Play nimmt die
      # mapping.txt auch direkt am Release entgegen (Bundle-Explorer →
      # Downloads → Mapping-Datei hochladen); hier liegt sie 90 Tage bereit.
      - name: R8-Mapping als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        # Nur Bequemlichkeit: Ist GitHubs Artefakt-Speicher voll (so am 25.09.
        # passiert), darf das den Store-Upload danach nicht verhindern.
        continue-on-error: true
        with:
          name: FullRep-${{ env.VN }}-vc${{ env.VC }}-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Zu Google Play hochladen
        if: ${{ inputs.upload }}
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ROLLOUT: ${{ inputs.rollout }}
          NOTES: ${{ inputs.notes }}
          TRACK: ${{ inputs.track || 'production' }}
        run: |
          # Eigene venv: Ubuntu-Runner erlauben kein pip3 install ins System-Python.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          printf '%s' "$PLAY_KEY_JSON" > "$RUNNER_TEMP/play-key.json"
          # Ein gestaffelter Rollout gilt nur fuer production; im internen Test
          # gibt es keine Fraktionen — dort immer complete.
          if [ "$TRACK" != "production" ] || [ "$ROLLOUT" = "complete" ]; then ARG="--complete"; else ARG="--fraction $ROLLOUT"; fi
          PLAY_KEY="$RUNNER_TEMP/play-key.json" "$RUNNER_TEMP/venv/bin/python" scripts/play-upload.py \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track "$TRACK" $ARG --notes "$NOTES"
          rm -f "$RUNNER_TEMP/play-key.json"

      - name: Schluessel aufraeumen
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/keystore.properties "$RUNNER_TEMP/play-key.json"
          rm -rf "$RUNNER_TEMP/venv"
          rm -f "$RUNNER_TEMP/b64.err" "$RUNNER_TEMP/kt.out"
