name: Release-Preflight

# Beantwortet in ein paar Sekunden die Frage, an der ein Release-Lauf sonst erst
# nach 20 Minuten macOS-Zeit scheitert: liegen alle noetigen Secrets im Repo?
#
# Ausgegeben wird ausschliesslich "gesetzt" oder "FEHLT" — nie ein Wert, nie eine
# Laenge, nie ein Praefix. Ein Schluessel, der irgendwo im Klartext auftaucht,
# gilt als verbrannt.
#
# Zweite Aufgabe (seit 26.10.2026): Artefakt-Speicher aufraeumen. Ist er voll,
# laufen Builds gruen durch, legen aber kein AAB ab („Artifact storage quota has
# been hit“, am 23. und 25.10. so passiert). Von Hand geht das am Handy nur
# Lauf fuer Lauf. Steht hier statt in einer eigenen Datei, weil sich ein
# Workflow, den es auf main noch nicht gibt, nicht per Dispatch starten laesst.
on:
  workflow_dispatch:
    inputs:
      artefakte:
        description: 'Artefakte: nein = nur Secrets pruefen, anzeigen = auflisten, loeschen = alles ausser R8-Mappings loeschen'
        type: choice
        options: [nein, anzeigen, loeschen]
        default: nein

jobs:
  preflight:
    if: inputs.artefakte == '' || inputs.artefakte == 'nein'
    runs-on: ubuntu-latest
    steps:
      - name: Secrets pruefen
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          ASC_REVIEW_PASSWORD: ${{ secrets.ASC_REVIEW_PASSWORD }}
        run: |
          fehlt=0
          # Die Laenge mitzuzeigen ist kein Leck — GitHub maskiert Werte ohnehin —,
          # faengt aber den Fall ab, der uns 45 Minuten gekostet hat: ein Secret,
          # das versehentlich auf den Wert "-" gesetzt wurde (gh secret set --body -
          # nimmt den Wert direkt, nicht von der Standardeingabe). "gesetzt" allein
          # sagt darueber nichts.
          # Mindestlaenge je Secret. Der Keystore-Alias darf kurz sein — er ist ein
          # frei gewaehlter Name, sechs Zeichen sind voellig normal. Fuer ihn also
          # nur der Schutz gegen den "-"-Fall, nicht die allgemeine Heuristik.
          minimum() {
            case "$1" in
              ANDROID_KEY_ALIAS|ASC_KEY_ID) echo 3 ;;
              ASC_REVIEW_PASSWORD) echo 4 ;;
              *) echo 8 ;;
            esac
          }

          pruefe() {
            wert="${!1:-}"
            min=$(minimum "$1")
            if [ -z "$wert" ]; then
              printf '  %-34s FEHLT\n' "$1"
              fehlt=$((fehlt + 1))
            elif [ "${#wert}" -lt "$min" ]; then
              printf '  %-34s VERDAECHTIG — nur %s Zeichen\n' "$1" "${#wert}"
              fehlt=$((fehlt + 1))
            else
              printf '  %-34s gesetzt (%s Zeichen)\n' "$1" "${#wert}"
            fi
          }

          echo "Pruefkonto fuer Apple (asc.py --pruefnotiz, seit 04.10.2026)"
          pruefe ASC_REVIEW_PASSWORD

          echo
          echo "Play-API (play-listing.yml, Upload in android-release.yml)"
          pruefe PLAY_SERVICE_ACCOUNT_JSON

          echo
          echo "Android-Signierung (android-release.yml)"
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                   ANDROID_KEY_PASSWORD; do
            pruefe "$s"
          done

          echo
          echo "iOS-Signierung (ios-release.yml)"
          for s in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            pruefe "$s"
          done

          echo
          echo "App Store Connect (Upload + ASC-API)"
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do pruefe "$s"; done

          echo
          echo "Build-Umgebung (sonst startet die App ohne Backend)"
          for s in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_REVENUECAT_IOS_KEY \
                   VITE_REVENUECAT_ANDROID_KEY; do
            pruefe "$s"
          done

          echo
          if [ "$fehlt" -gt 0 ]; then
            echo "$fehlt Secret(s) fehlen oder sind verdaechtig — siehe docs/release-ci.md."
            # Der Lauf muss rot werden. Ein gruener Preflight, der darunter
            # "14 fehlen" schreibt, ist genau die Falle, die uns heute drei
            # Fehlversuche gekostet hat.
            exit 1
          else
            echo "Alle Secrets vorhanden."
          fi

  artefakte:
    if: inputs.artefakte == 'anzeigen' || inputs.artefakte == 'loeschen'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Artefakte auflisten und ggf. loeschen
        env:
          GH_TOKEN: ${{ github.token }}
          MODUS: ${{ inputs.artefakte }}
        run: |
          # R8-Mappings bleiben: Ohne sie sind Absturzberichte aus der Play
          # Console unlesbar, und sie sind klein. Alte AABs/IPAs liegen ohnehin
          # in den Stores.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes, .created_at, .expired] | @tsv' \
            > liste.tsv
          summe=0; frei=0; anzahl=0; geloescht=0
          while IFS=$'\t' read -r id name groesse datum abgelaufen; do
            anzahl=$((anzahl + 1)); summe=$((summe + groesse))
            if [ "$abgelaufen" = "true" ]; then continue; fi
            case "$name" in
              *-mapping) printf '  bleibt   %8s KB  %s  %s\n' $((groesse / 1024)) "${datum%T*}" "$name"; continue ;;
            esac
            printf '  %-8s %8s KB  %s  %s\n' "$([ "$MODUS" = loeschen ] && echo weg || echo -)" \
              $((groesse / 1024)) "${datum%T*}" "$name"
            frei=$((frei + groesse))
            if [ "$MODUS" = "loeschen" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && geloescht=$((geloescht + 1))
            fi
          done < liste.tsv
          echo
          echo "Artefakte: $anzahl, zusammen $((summe / 1024 / 1024)) MB"
          echo "Davon loeschbar: $((frei / 1024 / 1024)) MB"
          if [ "$MODUS" = "loeschen" ]; then
            echo "Geloescht: $geloescht. GitHub rechnet den Speicher erst in 6–12 h neu."
          else
            echo "Nur angezeigt, nichts geloescht."
          fi
