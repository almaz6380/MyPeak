name: Play-Eintrag aktualisieren

# Nur manuell. Der Store-Eintrag ist oeffentlich — den aendert man absichtlich,
# nicht als Nebenwirkung eines Push. Standard ist der Trockenlauf.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was aktualisiert wird'
        type: choice
        options: [screenshots, texte, grafiken, sprachen, abos, abo-setzen, abo-titel, website, standardsprache]
        default: screenshots
      lang:
        description: 'Sprache des Store-Eintrags'
        default: 'de-DE'
        required: true
      dry_run:
        description: 'Trockenlauf (nur anzeigen, nichts aendern)'
        type: boolean
        default: true
      laeufer:
        description: 'Wo laufen? github = GitHub-Rechner (kostet Minuten), mac = eigener Mac (Self-hosted Runner)'
        type: choice
        default: 'github'
        options: ['github', 'mac']

jobs:
  upload:
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        # Eigene venv unter RUNNER_TEMP: auf dem Mac verweigert das
        # System-Python ein pip install, und in Josefs Python soll nichts landen.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Play-Eintrag aktualisieren
        env:
          # Der Schluessel verlaesst die GitHub-Secrets nicht. Er wird nur in die
          # Datei geschrieben, die scripts/play-upload.py erwartet.
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode }}
          LANG_INPUT: ${{ inputs.lang }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_KEY_JSON:-}" ]; then
            echo "Secret PLAY_SERVICE_ACCOUNT_JSON fehlt im Repository." >&2
            exit 1
          fi
          printf '%s' "$PLAY_KEY_JSON" > "$RUNNER_TEMP/play-key.json"
          export PLAY_KEY="$RUNNER_TEMP/play-key.json"

          GEMEINSAM=(--lang "$LANG_INPUT")
          if [ "$DRY_RUN" = "true" ]; then
            GEMEINSAM+=(--dry-run)
            echo "::notice::Trockenlauf — es wird nichts am Store-Eintrag geaendert."
          else
            echo "::warning::Echter Lauf — der oeffentliche Play-Eintrag wird jetzt geaendert."
          fi

          case "$MODE" in
            standardsprache)
              # Rueckfall-Sprache fuer Laender ohne eigenes Listing (seit 22.10.2026 en-US)
              python3 scripts/play-upload.py --standardsprache en-US "${GEMEINSAM[@]}"
              ;;
            website)
              # Website im Eintrag (contactWebsite). Daran haengt app-ads.txt.
              python3 scripts/play-upload.py --website https://fullrep.pages.dev "${GEMEINSAM[@]}"
              ;;
            abo-titel)
              # Nur der Anzeigename. Getrennt vom Preis, weil der Preis-PATCH
              # die komplette Regionstabelle mitvalidiert und an Altlasten
              # scheitert (BG hat EUR gespeichert, Katalog 2022/02 will BGN).
              # Fuer en-US auch die Beschreibung: ohne englisches Abo-Listing
              # laesst Play die Standardsprache nicht auf en-US umstellen.
              EXTRA=()
              if [ "$LANG_INPUT" = "en-US" ]; then
                EXTRA=(--abo-beschreibung 'Ad-free FullRep with AI coach, label scan, AI meal plan and stats.')
              fi
              python3 scripts/play-upload.py \
                --abo-setzen mypeak_premium_monthly \
                --abo-titel 'FullRep Premium' "${EXTRA[@]}" "${GEMEINSAM[@]}"
              ;;
            abo-setzen)
              # Preis nur fuer die EUR-Regionen und den Anzeigenamen. Play
              # rechnet andere Waehrungen nur in der Console um; ueber die API
              # muesste man 173 Betraege selbst erfinden.
              python3 scripts/play-upload.py \
                --abo-setzen mypeak_premium_monthly \
                --abo-preise 'monthly=4,99;annual=44,99' \
                --abo-titel 'FullRep Premium' "${GEMEINSAM[@]}"
              ;;
            abos)
              # Liest nur — Basis-Tarife, Zustand und Preise der Play-Abos.
              # Kennt weder --lang noch --dry-run, deshalb ohne GEMEINSAM.
              python3 scripts/play-upload.py --abos
              ;;
            texte)
              python3 scripts/play-upload.py \
                --listing "store-assets/play-listing.$LANG_INPUT.json" "${GEMEINSAM[@]}"
              ;;
            grafiken)
              # App-Symbol und Vorstellungsgrafik sind zwei getrennte Uploads;
              # jeder braucht seine eigene Edit-Transaktion.
              # Das Symbol ist in jeder Sprache dasselbe; die
              # Vorstellungsgrafik traegt Text und liegt je Sprache in
              # store-assets/<sprache>/android (de-DE im alten Pfad).
              SPRACHE="${LANG_INPUT%%-*}"
              FEATURE="store-assets/android/feature-graphic.png"
              [ "$SPRACHE" != "de" ] && FEATURE="store-assets/$SPRACHE/android/feature-graphic.png"
              if [ ! -f "$FEATURE" ]; then
                echo "Keine Vorstellungsgrafik fuer $LANG_INPUT ($FEATURE fehlt)." >&2
                exit 1
              fi
              python3 scripts/play-upload.py \
                --icon store-assets/android/icon-512.png "${GEMEINSAM[@]}"
              echo
              python3 scripts/play-upload.py \
                --feature "$FEATURE" "${GEMEINSAM[@]}"
              ;;
            sprachen)
              # Neue Sprache komplett: Texte, dann Screenshots, dann Grafiken,
              # je Sprache nacheinander. lang = kommagetrennte Liste. Ein Lauf
              # statt drei je Sprache, und weil alles in EINEM Job laeuft, ist
              # nie mehr als ein Edit offen.
              IFS=',' read -ra LISTE <<< "$LANG_INPUT"
              for L in "${LISTE[@]}"; do
                S="${L%%-*}"
                OPT=(--lang "$L"); [ "$DRY_RUN" = "true" ] && OPT+=(--dry-run)
                echo "═══ $L: Texte ═══"
                python3 scripts/play-upload.py --listing "store-assets/play-listing.$L.json" "${OPT[@]}"
                echo "═══ $L: Screenshots ═══"
                python3 scripts/play-upload.py --screenshots "store-assets/$S/android" "${OPT[@]}"
                echo "═══ $L: Symbol ═══"
                python3 scripts/play-upload.py --icon store-assets/android/icon-512.png "${OPT[@]}"
                echo "═══ $L: Vorstellungsgrafik ═══"
                python3 scripts/play-upload.py --feature "store-assets/$S/android/feature-graphic.png" "${OPT[@]}"
              done
              ;;
            *)
              # Je Sprache eigener Ordner (scripts/store-rahmen.mjs): de-DE
              # liegt im alten Pfad, sonst store-assets/<sprache>/android.
              SPRACHE="${LANG_INPUT%%-*}"
              ORDNER="store-assets/android"
              [ "$SPRACHE" != "de" ] && ORDNER="store-assets/$SPRACHE/android"
              if [ ! -d "$ORDNER" ]; then
                echo "Keine Screenshots fuer $LANG_INPUT ($ORDNER fehlt)." >&2
                exit 1
              fi
              python3 scripts/play-upload.py \
                --screenshots "$ORDNER" "${GEMEINSAM[@]}"
              ;;
          esac

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/play-key.json"
