name: Play-Eintrag aktualisieren

# Nur manuell. Der Store-Eintrag ist oeffentlich — den aendert man absichtlich,
# nicht als Nebenwirkung eines Push. Standard ist der Trockenlauf.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was aktualisiert wird'
        type: choice
        options: [screenshots, texte]
        default: screenshots
      lang:
        description: 'Sprache des Store-Eintrags'
        default: 'de-DE'
        required: true
      dry_run:
        description: 'Trockenlauf (nur anzeigen, nichts aendern)'
        type: boolean
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        run: pip3 install --quiet pyjwt cryptography

      - name: Play-Eintrag aktualisieren
        env:
          # Der Schluessel verlaesst die GitHub-Secrets nicht. Er wird nur in die
          # Datei geschrieben, die scripts/play-upload.py erwartet.
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode }}
          LANG_INPUT: ${{ inputs.lang }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_KEY_JSON:-}" ]; then
            echo "Secret PLAY_SERVICE_ACCOUNT_JSON fehlt im Repository." >&2
            exit 1
          fi
          mkdir -p ~/.config/play-publisher
          printf '%s' "$PLAY_KEY_JSON" > ~/.config/play-publisher/key.json

          if [ "$MODE" = "texte" ]; then
            ARGS=(--listing "store-assets/play-listing.$LANG_INPUT.json")
          else
            ARGS=(--screenshots store-assets/android)
          fi
          ARGS+=(--lang "$LANG_INPUT")

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
            echo "::notice::Trockenlauf — es wird nichts am Store-Eintrag geaendert."
          else
            echo "::warning::Echter Lauf — der oeffentliche Play-Eintrag wird jetzt geaendert."
          fi

          python3 scripts/play-upload.py "${ARGS[@]}"

      - name: Schluessel entfernen
        if: always()
        run: rm -f ~/.config/play-publisher/key.json
