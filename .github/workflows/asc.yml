name: App Store Connect

# Nur manuell. Laeuft auf Linux — die ASC-API braucht keinen Mac, anders als
# der Build. Der .p8-Schluessel wird aus dem base64-Secret dekodiert und nur
# als Umgebungsvariable weitergereicht, nie in eine Datei geschrieben.
#
#   status          liest nur
#   version-anlegen neue App-Store-Version + "Neu in dieser Version"
#   beschreibung    Beschreibung + Support-/Marketing-URL (3.1.2: EULA-Link)
#   lokalisieren    Store-Seite EN/ES/FR/PT/AR anlegen (Texte aus store-assets/)
#   name            Anzeigename + Untertitel auf FullRep
#   build           den Build aus "build_nr" der offenen Version zuweisen
#   screenshots     iPhone- + iPad-Bilder ersetzen
#   abo-screenshot  Paywall-Bild an alle Abos (gegen "Missing Metadata")
#   abo-namen       Abo-Anzeigenamen MyPeak -> FullRep
#   einreichungen   alle Einreichungen samt Zustand zeigen (liest nur)
#   aufraeumen      festhaengende Einreichungen zurueckziehen
#   abo-notiz       Prueferhinweis am Abo setzen
#   inhaberrechte   contentRightsDeclaration setzen (app-weit)
#   warum           liest nur: was blockiert die Einreichung?
#   exportfrage     usesNonExemptEncryption am Build beantworten
#   pruefnotiz      App-Review-Notiz: was sich seit der Ablehnung aendert
#   einreichen      Version samt Abos zur Pruefung
#   alles           die sechs schreibenden der Reihe nach
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was getan wird'
        type: choice
        options:
          - status
          - version-anlegen
          - beschreibung
          - lokalisieren
          - name
          - build
          - screenshots
          - abo-screenshot
          - abo-namen
          - einreichungen
          - aufraeumen
          - abo-notiz
          - inhaberrechte
          - warum
          - exportfrage
          - pruefnotiz
          - einreichen
          - alles
        default: status
      dry_run:
        description: 'Nur zeigen, nichts an Apple senden'
        type: boolean
        default: true
      version_nr:
        description: 'Versionsnummer fuer "version-anlegen" (z. B. 1.5.0)'
        type: string
        default: '1.5.0'
      build_nr:
        description: 'Build-Nummer fuer "build" und "alles" (muss in ASC VALID sein)'
        type: string
        default: '5'
      trotzdem:
        description: 'Einreichen, obwohl die Abos nicht mitkoennen — hat am 14.08. die Ablehnung 2.1(b) verursacht'
        type: boolean
        default: false
      laeufer:
        description: 'Wo laufen? github = GitHub-Rechner (kostet Minuten), mac = eigener Mac (Self-hosted Runner)'
        type: choice
        default: 'github'
        options: ['github', 'mac']

jobs:
  asc:
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        # Eigene venv unter RUNNER_TEMP: auf dem Mac verweigert das
        # System-Python ein pip install, und in Josefs Python soll nichts landen.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MODE: ${{ inputs.mode }}
          VERSION_NR: ${{ inputs.version_nr }}
          DRY: ${{ inputs.dry_run }}
          BUILD_NR: ${{ inputs.build_nr }}
          TROTZDEM: ${{ inputs.trotzdem }}
        run: |
          set -euo pipefail
          ASC_KEY_P8=$(printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d)
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8_BASE64 laesst sich nicht dekodieren."
            exit 1
          fi
          export ASC_KEY_P8

          # --build und --alles brauchen eine Nummer, die uebrigen nicht. Sie
          # stand hier fest auf 4 — nach der Ablehnung vom 14.08. verlangt
          # Apple einen neuen Build, also kommt sie jetzt aus der Eingabe.
          # Der Trockenlauf gilt nur fuer die schreibenden Befehle;
          # --status kennt ihn nicht.
          case "$MODE" in
            version-anlegen) ARGS="--version-anlegen $VERSION_NR" ;;
            build) ARGS="--build $BUILD_NR" ;;
            alles) ARGS="--alles --build $BUILD_NR" ;;
            *)     ARGS="--$MODE" ;;
          esac
          # warum liest nur, kennt --dry-run also nicht.
          if [ "$MODE" != "status" ] && [ "$MODE" != "warum" ] && [ "$MODE" != "einreichungen" ] && [ "$DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # Nur beim Einreichen sinnvoll; ueberall sonst waere er wirkungslos
          # und wuerde nur den Eindruck erwecken, es sei etwas erzwungen worden.
          if [ "$MODE" = "einreichen" ] && [ "$TROTZDEM" = "true" ]; then
            ARGS="$ARGS --trotzdem"
          fi
          echo "scripts/asc.py $ARGS"
          python3 scripts/asc.py $ARGS
