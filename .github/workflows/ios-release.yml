# iOS bauen, signieren und zu App Store Connect hochladen — auf einem macOS-Rechner
# von GitHub. Damit braucht ein Release keinen eigenen Mac mehr.
#
# Einmalige Einrichtung: siehe docs/release-ci.md (vier iOS-Secrets + zwei Klartext).
# WICHTIG: CURRENT_PROJECT_VERSION in ios/App/App.xcodeproj/project.pbxproj vorher
# erhoehen — Apple lehnt eine bereits benutzte Build-Nummer ab.
#
# Hinweis: macOS-Laeufer verbrauchen 10x so viele Minuten wie Linux; der Lauf dauert
# ~15-25 min. Das Einreichen zur Pruefung bleibt bewusst manuell (ASC).
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Wirklich zu App Store Connect hochladen? (aus = nur bauen)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    # macos-26 bringt Xcode 26 mit. Apple verlangt seit 2026 mindestens das
    # iOS-26-SDK fuer Uploads (sonst Fehler 90725).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci

      - name: Keine Test-Werbung im Release
        run: |
          if ! grep -q 'const USE_TEST_ADS = false' src/lib/ads.js; then
            echo "ABBRUCH: USE_TEST_ADS steht nicht auf false — es wuerden Test-Anzeigen ausgeliefert."
            exit 1
          fi
          echo "ok — echte Anzeigen-IDs"

      - name: Build-Nummer anzeigen
        run: |
          B=$(grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj | tr -dc '0-9')
          V=$(grep -m1 MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj | cut -d'=' -f2 | tr -d ' ;')
          echo "Version $V · Build $B"
          echo "B=$B" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Web-Bundle + Capacitor-Sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
        run: |
          npm run build
          npx cap sync ios

      - name: Signierung einrichten
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Nur base64-Alphabet durchlassen — beim Einfuegen in ein GitHub-Secret
          # rutschen leicht Leerzeichen oder Umbrueche mit hinein.
          printf '%s' "$CERT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: ExportOptions schreiben
        run: |
          cat > /tmp/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>JU8STVD4SJ</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Archivieren
        run: |
          cd ios/App
          # Capacitor 8 bindet die Plugins ueber Swift Package Manager ein — es gibt
          # kein .xcworkspace, deshalb -project statt -workspace.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      - name: Exportieren
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"

      - name: IPA als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: FullRep-ios-${{ env.V }}-b${{ env.B }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Zu App Store Connect hochladen
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/.appstoreconnect

      - name: Schluesselbund aufraeumen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
