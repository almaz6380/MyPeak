# iOS bauen, signieren und zu App Store Connect hochladen — auf einem macOS-Rechner
# von GitHub. Damit braucht ein Release keinen eigenen Mac mehr.
#
# Einmalige Einrichtung: siehe docs/release-ci.md (vier iOS-Secrets + zwei Klartext).
# WICHTIG: CURRENT_PROJECT_VERSION in ios/App/App.xcodeproj/project.pbxproj vorher
# erhoehen — Apple lehnt eine bereits benutzte Build-Nummer ab.
#
# Hinweis: macOS-Laeufer verbrauchen 10x so viele Minuten wie Linux; der Lauf dauert
# ~15-25 min. Das Einreichen zur Pruefung bleibt bewusst manuell (ASC).
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Wirklich zu App Store Connect hochladen? (aus = nur bauen)'
        type: boolean
        default: true
      nur_kompilieren:
        description: 'Nur kompilieren, ohne Signierung/Export? (prueft Code + Projektdatei, braucht keine App Group)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # macos-26 bringt Xcode 26 mit. Apple verlangt seit 2026 mindestens das
    # iOS-26-SDK fuer Uploads (sonst Fehler 90725).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci

      - name: Keine Test-Werbung im Release
        run: |
          if ! grep -q 'const USE_TEST_ADS = false' src/lib/ads.js; then
            echo "ABBRUCH: USE_TEST_ADS steht nicht auf false — es wuerden Test-Anzeigen ausgeliefert."
            exit 1
          fi
          echo "ok — echte Anzeigen-IDs"

      - name: Kauf angekuendigt, Schluessel vorhanden?
        # canPurchase verlangt beides: die Plattform-Flagge UND einen Schluessel im
        # Binary. Fehlt das Secret, baut das still eine App ohne sichtbaren Kauf —
        # genau der Zustand, fuer den Apple am 14.08.2026 2.1(b) vergeben hat.
        # Lieber hier abbrechen als 20 Minuten spaeter etwas Falsches hochladen.
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
        run: |
          if grep -q 'ios: true' src/pages/PaywallPage.jsx && [ -z "${VITE_REVENUECAT_IOS_KEY:-}" ]; then
            echo "::error::PURCHASE_ENABLED.ios ist true, aber VITE_REVENUECAT_IOS_KEY fehlt."
            echo "Der Build haette eine Paywall ohne Kauf-Button — Guideline 2.1(b)."
            exit 1
          fi
          echo "ok — Kauf-Flagge und Schluessel passen zusammen"

      - name: Build-Nummer anzeigen
        run: |
          B=$(grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj | tr -dc '0-9')
          V=$(grep -m1 MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj | cut -d'=' -f2 | tr -d ' ;')
          echo "Version $V · Build $B"
          echo "B=$B" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Web-Bundle + Capacitor-Sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
        run: |
          npm run build
          npx cap sync ios

      - name: Signierung einrichten
        if: ${{ !inputs.nur_kompilieren }}
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Nur base64-Alphabet durchlassen — beim Einfuegen in ein GitHub-Secret
          # rutschen leicht Leerzeichen oder Umbrueche mit hinein.
          printf '%s' "$CERT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # ⚠ Die Provisioning-Profile kommen seit 01.09.2026 FRISCH von der
      # ASC-API (scripts/ios-profile.py), nicht mehr aus dem Secret
      # IOS_PROVISIONING_PROFILE_BASE64. Grund: Mit der Widget-Extension
      # traegt die App eine App Group, und jede Faehigkeits-Aenderung an einer
      # Bundle-ID macht deren bestehende Profile INVALID — ein statisches
      # Secret waere ab da bei jedem Lauf tot, und aus einer Claude-Sitzung
      # kann niemand Secrets erneuern. Das Skript ersetzt ungueltige Profile
      # selbst (loeschen + neu anlegen, gleicher Name) und legt die
      # Widget-Bundle-ID bei Bedarf an.
      # ⚠ App Group anlegen/zuordnen kann die API NICHT — das ist Josefs
      # einmaliger Handgriff im Developer-Portal (siehe CLAUDE.md, Widget).
      - name: Provisioning-Profile von der API holen
        if: ${{ !inputs.nur_kompilieren }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyjwt cryptography
          ASC_KEY_P8=$(printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d)
          export ASC_KEY_P8
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          /tmp/venv/bin/python scripts/ios-profile.py \
            --bundle at.gallab.mypeak --name "MyPeak AppStore" \
            --faehigkeit HEALTHKIT --faehigkeit APP_GROUPS \
            --out "$PROFDIR/app.mobileprovision"
          /tmp/venv/bin/python scripts/ios-profile.py \
            --bundle at.gallab.mypeak.widget --name "FullRep Widget AppStore" \
            --bundle-anlegen "FullRep Widget" --faehigkeit APP_GROUPS \
            --out "$PROFDIR/widget.mobileprovision"

      - name: ExportOptions schreiben
        if: ${{ !inputs.nur_kompilieren }}
        run: |
          set -euo pipefail
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          # Bei signingStyle=manual verlangt xcodebuild eine Zuordnung
          # Bundle-ID -> Profilname JE TARGET (App + Widget); ohne sie bricht
          # der Export ab mit "requires a provisioning profile" — und zwar
          # erst NACH dem Archivieren, also nach drei Minuten.
          #
          # Namen und Bundle-IDs kommen aus den Profilen selbst statt aus
          # Konstanten: wird ein Profil bei Apple neu erzeugt oder umbenannt,
          # stimmt es hier automatisch weiter.
          ZUORDNUNG=""
          for P in "$PROFDIR"/app.mobileprovision "$PROFDIR"/widget.mobileprovision; do
            security cms -D -i "$P" > /tmp/profile.plist
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist)
            BUNDLE=${APPID#*.}          # fuehrende Team-ID abschneiden
            echo "Profil \"$NAME\" fuer $BUNDLE"
            if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE;" ios/App/App.xcodeproj/project.pbxproj; then
              echo "::error::Profil gilt fuer $BUNDLE, aber keine Target-Konfiguration traegt diese Bundle-ID."
              exit 1
            fi
            ZUORDNUNG="$ZUORDNUNG    <key>$BUNDLE</key><string>$NAME</string>\n"
          done

          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>JU8STVD4SJ</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
          $(printf "$ZUORDNUNG")
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint /tmp/ExportOptions.plist
          rm -f /tmp/profile.plist

      # Reiner Kompilier-Lauf: prueft Swift-Code und Projektdatei (z. B. die von
      # Hand eingesetzte Widget-Extension), ohne Zertifikate, Profile oder die
      # App Group zu brauchen. Bewusst VOR dem Portal-Schritt nutzbar.
      - name: Nur kompilieren (ohne Signierung)
        if: ${{ inputs.nur_kompilieren }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archivieren
        if: ${{ !inputs.nur_kompilieren }}
        run: |
          cd ios/App
          # Capacitor 8 bindet die Plugins ueber Swift Package Manager ein — es gibt
          # kein .xcworkspace, deshalb -project statt -workspace.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      - name: Exportieren
        if: ${{ !inputs.nur_kompilieren }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"

      - name: IPA als Artefakt ablegen
        if: ${{ !inputs.nur_kompilieren }}
        uses: actions/upload-artifact@v4
        with:
          name: FullRep-ios-${{ env.V }}-b${{ env.B }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Zu App Store Connect hochladen
        if: ${{ inputs.upload && !inputs.nur_kompilieren }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/.appstoreconnect

      - name: Schluesselbund aufraeumen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
